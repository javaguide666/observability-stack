# Grafana 自动配置：日志数据源。
# 地址是 loki-compat（把 qryn 的数字时间戳改成 Grafana 要求的字符串）。看板「日志 / 应用日志」和 Explore 都用它。
# 未启动日志栈时该数据源会显示异常，不影响 ClickHouse 数据源。
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki-compat:3100
    jsonData:
      timeout: 60
      maxLines: 1000
