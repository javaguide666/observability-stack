# ============================================================
# Grafana：统一查询 UI（Prometheus 指标 / 日志 LogQL / ClickHouse SQL，按已启动的组件生效）
#
# 单独启动（未启动的数据源会显示异常）：
#   docker compose -f docker-compose.grafana.yml up -d
#
# 服务器核心指标（Prometheus 先起，看板在文件夹「服务器」）：
#   docker compose -f docker-compose.prometheus.yml -f docker-compose.grafana.yml up -d
#
# 与日志栈一起（日志先要有 ClickHouse）：
#   docker compose -f docker-compose.clickhouse.yml -f docker-compose.loki.yml -f docker-compose.grafana.yml up -d
# ============================================================
name: obs-stack

services:
  grafana:
    image: ${REGISTRY_MIRROR:-}grafana/grafana:${GRAFANA_VERSION:-13.0.10}
    container_name: ${CONTAINER_PREFIX:-obs}-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"   # 本机唯一 Grafana：Loki 日志 + Prometheus 指标。容器内仍是 3000，宿主默认 3002
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-Admin13278}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${LOCAL_DATA_DIR:-./data}/grafana:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: ${OBS_NETWORK:-obs-net}
    driver: bridge
