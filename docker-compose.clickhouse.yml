# ============================================================
# ClickHouse：指标 / 业务 OLAP；日志栈的 qryn 也把日志写进同一实例的库 obs_logs
#
# 启动：docker compose -f docker-compose.clickhouse.yml up -d
# 停止：docker compose -f docker-compose.clickhouse.yml down
#
# 可视化（可选，另起 Grafana）：
#   docker compose -f docker-compose.clickhouse.yml -f docker-compose.grafana.yml up -d
# ============================================================
name: obs-stack

services:
  clickhouse:
    image: ${REGISTRY_MIRROR:-}clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
    container_name: ${CONTAINER_PREFIX:-obs}-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP
      - "${CLICKHOUSE_NATIVE_PORT:-9001}:9000"     # Native（宿主 9001，9000 留给本机其它服务）
    environment:
      # 25.x 未设密码时会禁止 default 远程登录，客户端会报 Code 194
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-Admin13278}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-wealth_freedom_olap}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/clickhouse/data:/var/lib/clickhouse
      - ./config/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: ${OBS_NETWORK:-obs-net}
    driver: bridge
