# ============================================================
# Redis 8.10 GA：缓存 / 锁
#
# 单独启动：docker compose -f docker-compose.redis.yml up -d
# 停止：    docker compose -f docker-compose.redis.yml down
# ============================================================
name: obs-stack

services:
  redis:
    image: ${REGISTRY_MIRROR:-}redis:${REDIS_VERSION:-8.10.1}
    container_name: ${CONTAINER_PREFIX:-obs}-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-Admin13278@} --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-Admin13278@}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: ${OBS_NETWORK:-obs-net}
    driver: bridge
