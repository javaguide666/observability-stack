# ============================================================
# Grafana Loki：日志聚合（单体模式 + RustFS 对象存储）
#
# 启动：docker compose -f docker-compose.loki.yml up -d
# 采集：docker compose -f docker-compose.loki.yml --profile logs up -d
# 停止：docker compose -f docker-compose.loki.yml down
#
# 可视化（可选，另起 Grafana）：
#   docker compose -f docker-compose.loki.yml -f docker-compose.grafana.yml up -d
# ============================================================
name: obs-stack

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0}
    container_name: obs-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"     # S3 API
      - "9002:9001"     # Console（宿主 9001 预留给 ClickHouse native）
    environment:
      # 账号密码必填；RustFS 禁止使用默认的 rustfsadmin
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请在 .env 中设置 RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请在 .env 中设置 RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [obs]

  # 一次性任务：用 RustFS 官方 rc 客户端创建 Loki 所需的 bucket（loki-data）
  rustfs-init:
    image: rustfs/rc:${RUSTFS_RC_VERSION:-v0.1.36}
    container_name: obs-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until rc alias set local http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY" >/dev/null 2>&1; do sleep 2; done
        rc bucket create --ignore-existing local/loki-data
        echo "bucket loki-data ready"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请在 .env 中设置 RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请在 .env 中设置 RUSTFS_SECRET_KEY}
    networks: [obs]

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.7}
    container_name: obs-loki
    restart: unless-stopped
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/config.yml -config.expand-env=true
    ports:
      - "3100:3100"
    environment:
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?请在 .env 中设置 RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?请在 .env 中设置 RUSTFS_SECRET_KEY}
    volumes:
      - ./config/loki-config.yml:/etc/loki/config.yml:ro
      - ./data/loki:/loki
    networks: [obs]

  # Promtail 已于 2026-03 停止维护，官方继任者为 Grafana Alloy。
  alloy:
    image: grafana/alloy:latest
    container_name: obs-alloy
    profiles: ["logs"]
    restart: unless-stopped
    depends_on:
      - loki
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - ./data/host-logs:/var/log/host:ro
    networks: [obs]

networks:
  obs:
    name: obs-net
    driver: bridge
