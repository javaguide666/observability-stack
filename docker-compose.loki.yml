# ============================================================
# 日志：qryn 只做 Loki 协议搬运，存储复用已有 ClickHouse
#
# qryn 实现 Loki Push 与 LogQL，本身不落盘。日志写入 ClickHouse 库 obs_logs。
# 查询用 Grafana（http://localhost:3002 ，看板「日志 / 应用日志」）。服务名保持 loki，端口保持 3100。
#
# 先起 ClickHouse，再起本文件：
#   docker compose -f docker-compose.clickhouse.yml up -d
#   docker compose -f docker-compose.loki.yml up -d
# 采集：docker compose -f docker-compose.loki.yml --profile logs up -d
# 查询：docker compose -f docker-compose.grafana.yml up -d
# 停止：docker compose -f docker-compose.loki.yml down
# ============================================================
name: obs-stack

services:
  # 无状态。重启不丢日志，日志在 ClickHouse。
  loki:
    image: ${REGISTRY_MIRROR:-}qxip/qryn:${QRYN_VERSION:-3.2.39}
    container_name: ${CONTAINER_PREFIX:-obs}-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    environment:
      CLICKHOUSE_SERVER: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_PROTO: http
      # user:password。密码里不能含冒号，否则这里会被拆错。
      CLICKHOUSE_AUTH: ${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-Admin13278}
      CLICKHOUSE_DB: obs_logs
      LABELS_DAYS: ${LOG_RETENTION_DAYS:-7}
      SAMPLES_DAYS: ${LOG_RETENTION_DAYS:-7}
      HOST: 0.0.0.0
      PORT: "3100"
    healthcheck:
      # /loki/api/v1/labels 会打到 ClickHouse，能返回才算搬运层就绪。
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/loki/api/v1/labels').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

  # Grafana 的 Loki 插件要求时间戳是字符串。qryn 返回的是数字，经此转发再给 Grafana。
  loki-compat:
    image: ${REGISTRY_MIRROR:-}node:${NODE_VERSION:-22-alpine}
    container_name: ${CONTAINER_PREFIX:-obs}-loki-compat
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      UPSTREAM: http://loki:3100
      PORT: "3100"
    command: ["node", "/opt/grafana-compat.mjs"]
    volumes:
      - ./config/loki/grafana-compat.mjs:/opt/grafana-compat.mjs:ro
    networks: [obs]

  # Promtail 已于 2026-03 停止维护，官方继任者为 Grafana Alloy。
  alloy:
    image: ${REGISTRY_MIRROR:-}grafana/alloy:${ALLOY_VERSION:-v1.20.1}
    container_name: ${CONTAINER_PREFIX:-obs}-alloy
    profiles: ["logs"]
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config/alloy.config.alloy:/etc/alloy/config.alloy:ro
      - ${LOCAL_DATA_DIR:-./data}/host-logs:/var/log/host:ro
    # alloy 镜像无 shell/curl/wget，无法做容器内 healthcheck
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: ${OBS_NETWORK:-obs-net}
    driver: bridge
