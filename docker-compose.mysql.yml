# ============================================================
# MySQL 9.7 LTS：开发主库（首次启动创建 nacos / admin）
#
# 启动：docker compose -f docker-compose.mysql.yml up -d
# 停止：docker compose -f docker-compose.mysql.yml down
# ============================================================
name: obs-stack

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-9.7.2}
    container_name: obs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin13278@}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: nacos_config
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --lower_case_table_names=1
      --explicit-defaults-for-timestamp=ON
    ports:
      - "3306:3306"
    volumes:
      - ${DOCKER_DATA_DIR:-/Users/eric_brewer/.docker}/mysql/data:/var/lib/mysql
      - ${DOCKER_DATA_DIR:-/Users/eric_brewer/.docker}/mysql/conf:/etc/mysql/conf.d
      - ./config/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: obs-net
    driver: bridge
