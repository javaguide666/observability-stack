# ============================================================
# Jenkins LTS + Wealth CI 工具（docker/kubectl/mvn/jdk25）
# 启动：docker compose -f docker-compose.jenkins.yml up -d --build
# 控制台：http://localhost:${JENKINS_PORT:-18080}
# 宿主路径均可在 .env 覆盖：JENKINS_KUBE_DIR / JENKINS_SSH_DIR / JENKINS_WORKSPACE_DIR
# Pipeline 备份：./jenkins/
# ============================================================
name: obs-stack

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: ${JENKINS_IMAGE:-wealth-jenkins:lts-ci}
    container_name: ${CONTAINER_PREFIX:-obs}-jenkins
    restart: unless-stopped
    privileged: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_HOME: /opt/java/jdk-25
      PATH: /opt/java/jdk-25/bin:/opt/maven/bin:/usr/local/bin:/opt/java/openjdk/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # 放开 userContent 的默认 CSP（默认 sandbox + default-src 'none' 会禁掉脚本和 XHR，新控制台无法运行）。
      # 仅允许同源脚本/请求；Element Plus 运行时需要内联 style。
      # allow-popups：否则「Jenkins 原生页面」「在 Jenkins 打开」这类 target=_blank 点击无反应。
      # allow-popups-to-escape-sandbox：新开的 Jenkins 页面不再继承这份沙箱。
      # allow-top-navigation-by-user-activation：弹窗被拦截时可以改在当前页打开。
      JAVA_OPTS: >-
        -Dhudson.model.DirectoryBrowserSupport.CSP="sandbox allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-downloads; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    ports:
      - "${JENKINS_PORT:-18080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/jenkins/home:/var/jenkins_home
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${JENKINS_KUBE_DIR:-${HOME}/.kube}:/var/jenkins_home/.kube:ro
      - ${JENKINS_SSH_DIR:-${HOME}/.ssh}:/var/jenkins_home/.ssh:ro
      - ./jenkins:/jenkins-backup:ro
      # 新控制台（先 pnpm build 生成 dist/，见 jenkins/console/README.md）
      - ./jenkins/console/dist:/var/jenkins_home/userContent/wealth:ro
      # 旧页面保留作回退：http://localhost:${JENKINS_PORT:-18080}/userContent/wealth-legacy/
      - ./jenkins/ui:/var/jenkins_home/userContent/wealth-legacy:ro
      - ./jenkins/init.groovy.d/wealth-ui.groovy:/var/jenkins_home/init.groovy.d/wealth-ui.groovy:ro
      # 可选：直接挂本机三仓，Pipeline 也可 git clone
      - ${JENKINS_WORKSPACE_DIR:-${HOME}/gitee}:/gitee:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/login || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 90s
    group_add:
      - "0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [obs]

networks:
  obs:
    name: ${OBS_NETWORK:-obs-net}
    driver: bridge
